spring:
  datasource:
    url: jdbc:h2:mem:evco;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    allow-bean-definition-overriding: true
app:
  jwt:
    # developer secret; replace in production via APP_JWT_SECRET env var
    secret: "dev-very-long-secret-please-change-1234567890"
    expires-in: 86400000 # 1 day in ms
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
