server:
  port: 8080

spring:
  application:
    name: evco-backend

  datasource:
    url: jdbc:mysql://localhost:3309/evco_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: localhost
    port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: "g6H8sK92LmN7QpZxA1B2C3D4E5F6G7H8"
    expires-in: 86400000
